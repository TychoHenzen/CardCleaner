name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full GdUnit suite instead of the fast PR suite'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out private assets
        uses: ./.github/actions/checkout-assets
        with:
          key: ${{ secrets.ASSETS_DEPLOY_KEY }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.410

      - name: Restore dependencies
        run: dotnet restore CardCleaner.csproj

      - name: Build with analyzers
        run: dotnet build CardCleaner.csproj --no-restore --configuration Release /p:EnableNETAnalyzers=true /p:EnforceCodeStyleInBuild=true

      - name: Download Godot 4.7.1 .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'Godot_v4.7.1-stable_mono_win64.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP 'godot-4.7.1-stable-mono'
          $downloadUrl = 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip'

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force

          $godotBinary = Get-ChildItem -LiteralPath $extractPath -Filter 'Godot_v4.7.1-stable_mono_win64.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $godotBinary) {
            throw "Godot binary was not found under $extractPath"
          }

          "GODOT_BIN=$($godotBinary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check latest weekly GdUnit result
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=schedule&per_page=1"
          $latest = (Invoke-RestMethod -Headers $headers -Uri $uri).workflow_runs | Select-Object -First 1
          if ($null -eq $latest) {
            Write-Warning 'No weekly GdUnit run exists yet; PR validation remains available until the first scheduled full suite.'
            exit 0
          }
          if ($latest.status -ne 'completed' -or $latest.conclusion -ne 'success') {
            throw "Latest weekly GdUnit run is not green: status=$($latest.status), conclusion=$($latest.conclusion), run=$($latest.id)"
          }
          Write-Host "Latest weekly GdUnit run passed: $($latest.id)"

      - name: Run GdUnit tests
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.full }}' -eq 'true') {
            ./Scripts/ci/Run-GdUnit.ps1 -GodotBinary $env:GODOT_BIN
          }
          else {
            ./Scripts/ci/Run-GdUnit.ps1 -GodotBinary $env:GODOT_BIN -Fast
          }

      - name: Show the dependency gate report
        # DependencyGateTest prints its report to Godot's stdout, which Run-GdUnit.ps1 keeps in reports/ci. Echo it so
        # every run, pull requests included, shows the gated numbers in its log and summary (#240 AC-3).
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem -Path reports/ci -Filter 'godot*.stdout.log' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime)
          $lines = @($logs | Select-String -SimpleMatch 'dependency gate: ' | ForEach-Object { $_.Line.Trim() })
          if ($lines.Count -eq 0) {
            Write-Host 'No dependency gate report in reports/ci.'
            exit 0
          }
          $lines | ForEach-Object { Write-Host $_ }
          $summary = @('## Dependency gate', '', '```') + $lines + @('```')
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload GdUnit reports
        # Run-GdUnit.ps1 writes interruptions.txt when Godot crashed or stalled, so a run that resumed to green keeps
        # the logs of the interrupted attempt.
        if: failure() || github.event_name == 'schedule' || inputs.full || hashFiles('reports/ci/interruptions.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdunit-reports
          path: reports/ci
          if-no-files-found: warn

  runner-fixture:
    name: GdUnit runner fixture
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the runner fixture
        shell: powershell
        run: ./Scripts/ci/Test-RunGdUnit.ps1 -RunnerShell pwsh

  dependency-audit:
    name: NuGet vulnerability check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.410

      - name: Restore dependencies
        run: dotnet restore CardCleaner.csproj

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = dotnet list CardCleaner.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath dependency-audit.txt

          if ($exitCode -ne 0) {
            throw "dotnet list package failed with exit code $exitCode"
          }

          $vulnerablePackageLine = '(?im)^\s*>\s+\S+.*\b(Critical|High|Moderate|Low)\b\s+https?://'
          if ($output -match $vulnerablePackageLine) {
            throw 'NuGet vulnerabilities were reported. See dependency-audit.txt for details.'
          }

          Write-Host 'No vulnerable NuGet packages were reported.'

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.0

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  quality-guard:
    name: quality-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned to the dod-guard commit that ships quality-pr-gate.mjs and quality-pr-gate-comment.mjs.
      - name: Check out dod-guard quality-guard gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TychoHenzen/dod-guard
          ref: 9be9738711999948e065ce82d1e7918c2abe393c
          path: .dod-guard

      - name: Apply Godot quality-guard compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/.github/quality-guard-godot.patch"
          target="packages/quality-guard/skills/quality-refactor/scripts/lib/rules-reachability.mjs"
          git -C .dod-guard apply --check --whitespace=error "$patch_file"
          git -C .dod-guard apply --whitespace=error "$patch_file"
          test "$(git -C .dod-guard diff --name-only)" = "$target"

      - name: Test Godot quality-guard reachability compatibility
        run: node .github/quality-guard-godot.test.mjs --scanner-root=.dod-guard/packages/quality-guard/skills/quality-refactor/scripts

      # Blocks high findings this pull request adds to the Scripts files it changes, and asks it to remove at least
      # one medium/high finding that was already there. Medium findings never block but are counted: new ones are
      # listed in the report, and removing existing ones pays the quota. Findings that were already there never
      # block; the full list is the quality-gate-report artifact, referenced from one pull request comment.
      # Tighten later with --block-on=medium, or per rule with --rule-block-on=<rule>:medium.
      - name: Block new findings in changed Scripts files
        run: >-
          node .dod-guard/packages/quality-guard/skills/quality-refactor/scripts/quality-pr-gate.mjs
          --base=${{ github.event.pull_request.base.sha }} --root=Scripts
          --block-on=high
          --report=quality-gate-report.md --comment=quality-gate-comment.md
          --report-link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload the quality gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-report
          path: quality-gate-report.md
          if-no-files-found: ignore

      # Best effort: a token that cannot comment (forks, Dependabot) only logs a warning.
      - name: Update the quality gate comment
        if: always() && hashFiles('quality-gate-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .dod-guard/packages/quality-guard/skills/quality-refactor/scripts/quality-pr-gate-comment.mjs
          --repo=${{ github.repository }} --pr=${{ github.event.pull_request.number }}
          --body=quality-gate-comment.md
